[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "app-fi"
version = "1.0.0"
description = "FinApple — app financeiro pessoal e gamificado em Python + Flet"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }

# Apenas dependências diretas (o que o código realmente importa).
# O pip resolve as transitivas (anyio, httpx, etc.) sozinho.
dependencies = [
    "flet==0.86.5",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.flet.app]
# main.py mora em src/app_fi/main.py, não na raiz — flet build precisa de um
# main.py direto na pasta apontada aqui. Aponta pra src/ (não src/app_fi/) pra
# preservar app_fi/ como pacote real dentro do bundle, porque main.py usa
# imports absolutos `from app_fi.xxx import ...` em todo o projeto — se
# apontasse pra src/app_fi/ direto, o conteúdo virava a raiz do bundle e esses
# imports quebrariam em runtime. src/main.py é só um launcher fino pro build.
path = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Assets de imagem não estão aqui: moraram em src/app_fi/assets/, mas agora
# ficam em src/assets/ (fora do pacote) — ver comentário em [tool.flet.app].
app_fi = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
